name: Parjamie
options:
  bundleIdPrefix: net.parjamie
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Parjamie:
    path: .

targets:
  Parjamie:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources/Assets.xcassets
      - path: App/Resources/Sounds
        buildPhase: resources
    dependencies:
      - package: Parjamie
        product: ParjamieEngine
      - package: Parjamie
        product: ParjamieNet
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Parjamie
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The app adds no encryption of its own, so TestFlight builds skip the export
        # compliance question.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        NSLocalNetworkUsageDescription: >-
          Parjamie looks for the other player's phone on your network so the two of you can play.
        NSBonjourServices:
          - _parjamie._tcp
        LSApplicationCategoryType: public.app-category.board-games
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.parjamie.game
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "5"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        DEVELOPMENT_TEAM: NQ6AJVVBBJ
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # A native Mac app built from the same code, sharing the iPhone app's bundle ID.
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/Resources/Parjamie-Mac.entitlements
